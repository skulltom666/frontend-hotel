<div class="kpi-container">
  <div class="kpi-card total">
    <span class="label">TOTAL</span>
    <span class="value">{{ stats.total }}</span>
  </div>
  <div class="kpi-card disponible">
    <span class="label">DISPONIBLES</span>
    <span class="value">{{ stats.disponibles }}</span>
  </div>
  <div class="kpi-card ocupada">
    <span class="label">OCUPADAS</span>
    <span class="value">{{ stats.ocupadas }}</span>
  </div>
  <div class="kpi-card sucia">
    <span class="label">SUCIAS</span>
    <span class="value">{{ stats.sucias }}</span>
  </div>
  <div class="kpi-card limpieza">
    <span class="label">EN LIMPIEZA</span>
    <span class="value">{{ stats.limpieza }}</span>
  </div>
</div>
