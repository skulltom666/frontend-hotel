<div style="padding: 40px; max-width: 500px; margin: auto; font-family: sans-serif;">
  <h2>Registrar los datos de tu Hotel</h2>
  <p style="color: #666;">Completa la información para empezar a gestionar.</p>

  <form (ngSubmit)="guardarHotel()" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
    <div>
      <label>Nombre del Hotel:</label>
      <input type="text" name="nombre" [(ngModel)]="hotel.nombre" required
             style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
    </div>

    <div>
      <label>Dirección:</label>
      <input type="text" name="direccion" [(ngModel)]="hotel.direccion" required
             style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
    </div>

    <button type="submit"
            style="background: #28a745; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
      Finalizar y Crear Hotel
    </button>
  </form>
</div>
